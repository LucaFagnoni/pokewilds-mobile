name: PokeWilds build

# One release per commit with every file: the iPhone IPA, the Android APK, the
# Windows/macOS/Linux games and the Windows/macOS/Linux servers. It starts as a draft (nobody sees it), each build
# uploads its file, and it is published as "Latest" only when all builds
# passed; otherwise the draft is deleted. So releases/latest/download/<file>
# always gives a matching set.
on:
  workflow_dispatch:
    inputs:
      fallback:
        description: "Skip the macOS job and build the IPA with the xtool fallback (to test it)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests build and test the server, but publish nothing.
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2
  # Stripped engine profile shared by the iOS template and the Linux smoke test.
  ENGINE_PROFILE: ${{ github.workspace }}/.github/engine/custom.py

# Releases hold the files: they do not count against the Actions storage quota
# that artifacts fill up.
permissions:
  contents: write
  # ios_xtool and ios read each other's state (actions/runs/<id>/jobs).
  actions: read

jobs:
  draft:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      version: ${{ steps.names.outputs.version }}
      bundle: ${{ steps.names.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Zero-padded: GitHub lists releases by tag name, so build-0010 must come
      # after build-0009. The IPA's visible version is MAJOR.MINOR from the iOS
      # preset's short_version plus the commit count (0.10.0 -> 0.10.<n>); raise
      # MAJOR.MINOR there by hand for bigger steps. Its internal version
      # (CFBundleVersion) is the commit count too. Counting commits, not runs,
      # gives a local build of the same commit (tools/ios_xtool) the same version.
      - id: names
        run: |
          # The iOS preset's, the first: the macOS presets carry one too.
          base=$(sed -n 's/^application\/short_version="\([0-9]*\.[0-9]*\).*/\1/p' project/export_presets.cfg | head -n 1)
          test -n "$base"
          count=$(git rev-list --count HEAD)
          echo "tag=build-$(printf '%04d' "$GITHUB_RUN_NUMBER")" >> "$GITHUB_OUTPUT"
          echo "version=$base.$count" >> "$GITHUB_OUTPUT"
          echo "bundle=$count" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          TAG: ${{ steps.names.outputs.tag }}
          VERSION: ${{ steps.names.outputs.version }}
          BUNDLE: ${{ steps.names.outputs.bundle }}
        run: |
          # The players' changelog: the first "## " section of CHANGELOG.md, when
          # CHANGELOG.md changed since the last published release; otherwise the
          # commit message, as before.
          last=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -f CHANGELOG.md ] && { [ -z "$last" ] || ! git diff --quiet "$last" HEAD -- CHANGELOG.md 2>/dev/null; }; then
            awk '/^## /{n++; next} n==1' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          fi
          [ -s notes.md ] || git log -1 --pretty=%B > notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "IPA version $VERSION ($BUNDLE). IPA, APK and server built from ${GITHUB_SHA::8}: they play together (a host refuses players of another build)." >> notes.md
          echo "- **Pokewilds-unsigned.ipa**: sign it with Feather (or similar) before installing." >> notes.md
          echo "- **Pokewilds-arm64.apk**: Android (64-bit ARM phones), signed; installs over the previous APK." >> notes.md
          echo "- **PokeWilds-Server-win64.zip**: unzip it and run start_server.bat. Guide: README_SERVER.md." >> notes.md
          echo "- **PokeWilds-Server-linux-x86_64.tar.gz** and **PokeWilds-Server-macos.zip**: the same server; unpack it and run ./start_server.sh. Guide: README_SERVER.md." >> notes.md
          echo "- **PokeWilds-win64.zip**, **PokeWilds-macos.zip**, **PokeWilds-linux-x86_64.tar.gz**: the game on a computer. macOS: unzip, then right-click PokeWilds.app > Open the first time (the app is not signed by Apple)." >> notes.md
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "PokeWilds $VERSION" --notes-file notes.md

  # Same engine profile on Linux (headless), run against the iOS pack: catches a
  # class or module the game needs but the profile dropped before it hits a phone.
  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Install Godot editor and SCons
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          # The engine source is a fixed tag: one cache per build profile and
          # game module (engine_modules); an older one is a start, only what
          # changed is built again.
          key: scons-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: scons-linux-${{ env.GODOT_VERSION }}-

      - name: Build stripped engine (Linux, headless only)
        working-directory: godot-src
        run: |
          "$RUNNER_TEMP/scons/bin/scons" platform=linuxbsd target=template_release profile="$ENGINE_PROFILE" \
            disable_path_overrides=no \
            x11=no wayland=no alsa=no pulseaudio=no dbus=no speechd=no fontconfig=no udev=no \
            cache_path="$HOME/.scons_cache" -j"$(nproc)"

      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-smoke-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-smoke-${{ env.GODOT_VERSION }}-

      - name: Export the iOS pack
        working-directory: project
        run: |
          "$GODOT" --headless --import
          "$GODOT" --headless --export-pack "iOS" "$RUNNER_TEMP/game.pck"

      - name: Load every script/scene, then run the game
        run: |
          engine=godot-src/bin/godot.linuxbsd.template_release.x86_64
          timeout 600 "$engine" --headless --main-pack "$RUNNER_TEMP/game.pck" -s "$PWD/.github/engine/smoke.gd" 2>&1 | tee smoke.log
          timeout 300 "$engine" --headless --main-pack "$RUNNER_TEMP/game.pck" --quit-after 900 2>&1 | tee -a smoke.log || true
          grep -E "ERROR|SMOKE" smoke.log | sort | uniq -c | sed 's/^/::notice::/'
          grep -q "SMOKE: checked [0-9]*, failed 0" smoke.log
          ! grep -E "SMOKE FAIL|SCRIPT ERROR|Parse Error|Cannot get class|Failed to load|not declared in the current scope" smoke.log

      # The engine's own world generator (engine_modules/pokewilds) makes the
      # GDScript generator's worlds: step by step, then the oracle's worlds.
      - name: Native world generator parity
        env:
          POKEWILDS_NATIVE_WORLDGEN: "1"
        run: |
          engine=godot-src/bin/godot.linuxbsd.template_release.x86_64
          timeout 1200 "$engine" --headless --main-pack "$RUNNER_TEMP/game.pck" -s "$PWD/.github/engine/native_worldgen_test.gd" 2>&1 | tee native.log
          timeout 1200 "$engine" --headless --main-pack "$RUNNER_TEMP/game.pck" -s "$PWD/.github/engine/worldgen_check.gd" 2>&1 | tee -a native.log
          grep -q "NATIVE TEST: failed 0" native.log
          grep -q "WORLDGEN: checked [0-9]*, failed 0" native.log

      # The engine's own population frame (engine_modules/pokewilds) against
      # the GDScript: an area's Pokemon frame by frame, then the World's
      # (population_sim_hash.gd, drawn and as the dedicated server runs it),
      # whose hashes must stay the GDScript's (the tests job).
      # This stripped release engine writes a few floats' last digit differently
      # from the official editor the tests job uses, so its population hash is
      # its own: the native and the GDScript run must give the same one here.
      - name: Native population parity
        run: |
          engine=godot-src/bin/godot.linuxbsd.template_release.x86_64
          POKEWILDS_NATIVE_POPULATION=1 timeout 1200 "$engine" --headless --path project -s "$PWD/.github/engine/native_population_test.gd" 2>&1 | tee native_population.log
          grep -q "NATIVE POPULATION TEST: failed 0" native_population.log
          for mode in "" --no-sprites; do
            for native in 1 0; do
              POKEWILDS_NATIVE_POPULATION=$native timeout 1800 "$engine" --headless --fixed-fps 60 --path project \
                -s "$PWD/server/population_sim_hash.gd" -- $mode 2>&1 | tee "pop$mode$native.log"
              grep -q "POPULATION SIM API OK" "pop$mode$native.log"
            done
            native=$(grep -E -o "POPULATION SIM seed=12345( no-sprites)? [0-9a-f]{64}" "pop${mode}1.log")
            script=$(grep -E -o "POPULATION SIM seed=12345( no-sprites)? [0-9a-f]{64}" "pop${mode}0.log")
            echo "::notice::native: $native / GDScript: $script"
            [ -n "$native" ] && [ "$native" = "$script" ]
          done

  ios:
    # Runs alongside the smoke test; publish needs the smoke test too, so only
    # a pack that passed it is released. ios_xtool watches this job: when no Mac
    # picks it up within a minute, xtool builds the IPA instead, and this job,
    # if a Mac comes later, stops at its first step.
    needs: draft
    if: ${{ !inputs.fallback }}
    runs-on: macos-26
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - name: Still needed?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          taken=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
            --jq '.jobs[] | select(.name == "ios_xtool") | .steps[] | select(.name == "Take over from the Mac job" and .conclusion == "success") | .name' || true)
          if [ -n "$taken" ]; then
            echo "::notice::ios_xtool already builds this IPA (no Mac within a minute)"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Install Godot + export templates
        if: env.SKIP != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/ios.zip' 'templates/version.txt' -d "$tpl"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "TPL=$tpl" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons

      - uses: actions/cache@v4
        if: env.SKIP != 'true'
        with:
          path: ~/.scons_cache
          # One cache per build profile and game module (see the smoke job).
          key: scons-ios-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: scons-ios-${{ env.GODOT_VERSION }}-

      - name: Build stripped engine (iOS arm64)
        if: env.SKIP != 'true'
        working-directory: godot-src
        run: |
          "$RUNNER_TEMP/scons/bin/scons" platform=ios arch=arm64 target=template_release profile="$ENGINE_PROFILE" lto=thin \
            cache_path="$HOME/.scons_cache" -j"$(sysctl -n hw.ncpu)"
          ls -la bin

      - name: Swap engine library into the iOS template
        if: env.SKIP != 'true'
        run: |
          work="$RUNNER_TEMP/ios_template"
          unzip -q "$TPL/ios.zip" -d "$work"
          lib="$work/libgodot.ios.release.xcframework/ios-arm64/libgodot.a"
          test -f "$lib" || { find "$work" -name '*.a'; exit 1; }
          echo "::notice::official engine lib $(du -h "$lib" | cut -f1)"
          cp godot-src/bin/libgodot.ios.template_release.arm64.a "$lib"
          echo "::notice::stripped engine lib $(du -h "$lib" | cut -f1)"
          rm "$TPL/ios.zip" && (cd "$work" && zip -qry "$TPL/ios.zip" .)

      - name: Minify JSON data
        if: env.SKIP != 'true'
        run: python3 .github/engine/minify_json.py project

      # The commit this build comes from, and its compat id (after minifying, as
      # every build does): hosts refuse players of a build with another compat id.
      # The IPA's visible and internal versions go up with every build.
      - name: Stamp build id and IPA version
        if: env.SKIP != 'true'
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          BUNDLE: ${{ needs.draft.outputs.bundle }}
        run: |
          echo "$GITHUB_SHA" > project/build_id.txt
          python3 tools/compat_id.py project > project/compat_id.txt
          # The title screen shows it in its corner.
          echo "$VERSION" > project/build_version.txt
          python3 - <<'EOF'
          import os, re
          path = "project/export_presets.cfg"
          text = open(path, newline="").read()
          text = re.sub(r'(?m)^application/short_version="[^"]*"', 'application/short_version="%s"' % os.environ["VERSION"], text)
          text = re.sub(r'(?m)^application/version="[^"]*"', 'application/version="%s"' % os.environ["BUNDLE"], text)
          open(path, "w", newline="").write(text)
          EOF
          grep -n '^application/short_version=\|^application/version=' project/export_presets.cfg

      # The phone's battery for the HUD (an iOS plugin): Godot's export links
      # this library into the Xcode project. Same deployment target as the preset.
      - name: Build the battery plugin
        if: env.SKIP != 'true'
        working-directory: project/ios/plugins/pokewilds_battery
        run: |
          xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=15.0 -O2 -fobjc-arc \
            -c pokewilds_battery.mm -o "$RUNNER_TEMP/pokewilds_battery.o"
          xcrun -sdk iphoneos ar rcs libpokewilds_battery.a "$RUNNER_TEMP/pokewilds_battery.o"

      # The lobby list's address and password (project/lobby_server.txt, never
      # in the repository): the secret LOBBY_SERVER holds the file's two lines.
      # Without it the build runs, but JOIN GAME has no online lobby list.
      - name: Lobby list address
        if: env.SKIP != 'true'
        env:
          LOBBY_SERVER: ${{ secrets.LOBBY_SERVER }}
        run: |
          if [ -n "$LOBBY_SERVER" ]; then printf '%s\n' "$LOBBY_SERVER" > project/lobby_server.txt
          else echo "::warning::No LOBBY_SERVER secret: this IPA has no online lobby list"; fi

      # Embedded ZeroTier for ONLINE play (an iOS plugin with libzt): libzt is
      # compiled once per commit and patch set, then only the plugin.
      - uses: actions/cache@v4
        if: env.SKIP != 'true'
        with:
          path: ~/.cache/pokewilds-libzt-ios
          key: libzt-ios-mac-${{ hashFiles('tools/build_libzt_ios.sh', 'libzt_patches.py') }}

      - name: Build the ZeroTier plugin
        if: env.SKIP != 'true'
        run: CC="xcrun -sdk iphoneos clang" AR="xcrun -sdk iphoneos ar" bash tools/build_libzt_ios.sh

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        if: env.SKIP != 'true'
        with:
          path: project/.godot
          key: godot-import-ios-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-ios-${{ env.GODOT_VERSION }}-

      - name: Export Xcode project
        if: env.SKIP != 'true'
        working-directory: project
        run: |
          mkdir -p ../build/ios
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "iOS" ../build/ios/Pokewilds.ipa

      # The engine is LTO bitcode, compiled again at every link (minutes): the
      # linker's cache keeps that work while the engine and Xcode stay the same.
      - id: xcode
        if: env.SKIP != 'true'
        run: echo "version=$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: env.SKIP != 'true'
        with:
          path: ~/lto-cache
          key: ios-lto-${{ steps.xcode.outputs.version }}-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: ios-lto-${{ steps.xcode.outputs.version }}-${{ env.GODOT_VERSION }}-

      - name: Build unsigned .app and pack IPA
        if: env.SKIP != 'true'
        working-directory: build/ios
        run: |
          set -o pipefail
          # Surface compiler errors as annotations (readable without log access).
          xcodebuild -project Pokewilds.xcodeproj -scheme Pokewilds -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            OTHER_LDFLAGS='$(inherited) -Wl,-cache_path_lto,'"$HOME/lto-cache" build 2>&1 | tee xb.log \
            || { grep -E -A3 'error[:]|FAILED|ld: |Undefined sym|referenced from|warning: .*(built for|newer)' xb.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/'; echo; exit 1; }
          mkdir Payload
          cp -R dd/Build/Products/Release-iphoneos/Pokewilds.app Payload/
          # Drop local/debug symbols from the engine binary; Feather re-signs afterwards.
          xcrun strip -Sx Payload/Pokewilds.app/Pokewilds
          du -sh Payload/Pokewilds.app/* | sed 's/^/::notice::/'
          zip -qry -9 Pokewilds-unsigned.ipa Payload

      - name: Add the IPA to the draft release
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$TAG" build/ios/Pokewilds-unsigned.ipa

  # The IPA's watchdog and fallback. It watches the ios job: when no Mac picks
  # it up within a minute, or the Mac build fails (or was skipped to test
  # this), it builds the same IPA on Linux with xtool (tools/ios_xtool): same
  # stripped engine, version and build id. Xcode, which xtool turns into the
  # iOS SDK, comes from the private LucaFagnoni/xcode-sdk release through a
  # read-only token (XCODE_SDK_TOKEN). Its output "ipa" is true when the
  # release has an IPA from either, so publish never waits for a Mac job that
  # GitHub takes ~15 minutes to give up on. Never on pull requests.
  ios_xtool:
    needs: draft
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      ipa: ${{ steps.mac.outputs.ipa || steps.upload.outputs.ipa }}
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the Mac job
        id: mac
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50"
          state() { gh api "$jobs" --jq '.jobs[] | select(.name == "ios") | "\(.status) \(.conclusion)"'; }
          start=$(date +%s)
          # A minute for a Mac to pick it up (a skipped job counts as completed).
          while :; do
            read -r status conclusion <<< "$(state)"
            if [ "$status" = in_progress ] || [ "$status" = completed ]; then break; fi
            if [ $(( $(date +%s) - start )) -ge 60 ]; then
              echo "::notice::No Mac runner within a minute: building the IPA with xtool"
              echo "fallback=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          # A Mac took it: wait for its build.
          while [ "$status" != completed ]; do
            sleep 30
            read -r status conclusion <<< "$(state)"
          done
          if [ "$conclusion" = success ]; then
            echo "ipa=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The Mac job ended $conclusion: building the IPA with xtool"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
          fi

      # The ios job's first step looks for this one: a Mac that comes later stops there.
      - name: Take over from the Mac job
        if: steps.mac.outputs.fallback == 'true'
        run: echo "xtool builds the IPA"

      - uses: actions/checkout@v4
        if: steps.mac.outputs.fallback == 'true'
        with:
          fetch-depth: 0

      - name: Download Xcode from the private repository
        if: steps.mac.outputs.fallback == 'true'
        env:
          GH_TOKEN: ${{ secrets.XCODE_SDK_TOKEN }}
        run: |
          gh release download xcode-27.1 -R LucaFagnoni/xcode-sdk -D "$RUNNER_TEMP/xcode"
          cd "$RUNNER_TEMP/xcode"
          # A release holds the .xip whole, or in pieces when over GitHub's 2 GiB limit.
          if ls *.part* >/dev/null 2>&1; then cat $(ls *.part* | sort) > Xcode.xip && rm -f *.part*; else mv Xcode_*.xip Xcode.xip; fi
          ls -la

      - uses: actions/cache@v4
        if: steps.mac.outputs.fallback == 'true'
        with:
          path: ~/pokewilds-ios/cache/engine
          # The stripped iOS engine, rebuilt only when the profile or the
          # game's engine module changes.
          key: xtool-engine-4.7.2-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}

      # That engine's SCons cache: a module change rebuilds only the module.
      - uses: actions/cache@v4
        if: steps.mac.outputs.fallback == 'true'
        with:
          path: ~/pokewilds-ios/cache/scons-ios
          key: xtool-scons-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**', 'tools/ios_xtool/setup.sh') }}
          restore-keys: xtool-scons-${{ env.GODOT_VERSION }}-

      # lld's LTO codegen of that engine (see Package.swift): the link takes
      # seconds instead of ~8 minutes. setup.sh pins xtool, which brings lld.
      - uses: actions/cache@v4
        if: steps.mac.outputs.fallback == 'true'
        with:
          path: ~/pokewilds-ios/cache/lto
          key: xtool-lto-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**', 'tools/ios_xtool/setup.sh') }}
          restore-keys: xtool-lto-${{ env.GODOT_VERSION }}-

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        if: steps.mac.outputs.fallback == 'true'
        with:
          path: ~/pokewilds-ios/project/.godot
          key: godot-import-xtool-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-xtool-${{ env.GODOT_VERSION }}-

      # libzt for the ZeroTier plugin (tools/build_libzt_ios.sh), compiled once.
      - uses: actions/cache@v4
        if: steps.mac.outputs.fallback == 'true'
        with:
          path: ~/pokewilds-ios/cache/libzt
          key: libzt-ios-xtool-${{ hashFiles('tools/build_libzt_ios.sh', 'libzt_patches.py', 'tools/ios_xtool/setup.sh') }}

      - name: Swift, xtool and the iOS SDK
        if: steps.mac.outputs.fallback == 'true'
        run: |
          bash tools/ios_xtool/setup.sh "$RUNNER_TEMP/xcode/Xcode.xip"
          rm -rf "$RUNNER_TEMP/xcode"

      # The lobby list's address and password (project/lobby_server.txt, never
      # in the repository): the secret LOBBY_SERVER holds the file's two lines.
      # Without it the build runs, but JOIN GAME has no online lobby list.
      - name: Lobby list address
        if: steps.mac.outputs.fallback == 'true'
        env:
          LOBBY_SERVER: ${{ secrets.LOBBY_SERVER }}
        run: |
          if [ -n "$LOBBY_SERVER" ]; then printf '%s\n' "$LOBBY_SERVER" > project/lobby_server.txt
          else echo "::warning::No LOBBY_SERVER secret: this IPA has no online lobby list"; fi

      # The smoke job already checked this pack with the stripped engine.
      - name: Build the IPA with xtool
        if: steps.mac.outputs.fallback == 'true'
        run: SMOKE=0 bash tools/ios_xtool/build_ipa.sh

      - name: Add the IPA to the draft release
        id: upload
        if: steps.mac.outputs.fallback == 'true'
        run: |
          gh release upload --clobber "$TAG" "$HOME/pokewilds-ios/Pokewilds-unsigned.ipa"
          gh release view "$TAG" --json body --jq .body > notes.md
          echo "" >> notes.md
          echo "IPA built on Linux with xtool (no macOS runner in time): same engine, version and build id; plain PNG icons and launch screen." >> notes.md
          gh release edit "$TAG" --notes-file notes.md
          echo "ipa=true" >> "$GITHUB_OUTPUT"

  server:
    needs: draft
    # On pull requests there is no draft: build and test only.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Stock editor + official templates (no custom engine): Windows only.
      - name: Install Godot + Windows export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/windows_release_x86_64*' 'templates/version.txt' -d "$tpl"
          ls -la "$tpl"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # The server's engine: the phones' stripped profile with the game's own
      # module (native world generation), cross-compiled for Windows with
      # MinGW, in place of the official template that the export copies.
      # Plus UPnP, which only the server uses (dedicated_server.gd opens its
      # port on the router; without the module it never tried).
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          # One cache per build profile and game module (see the smoke job).
          key: scons-windows-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: scons-windows-${{ env.GODOT_VERSION }}-

      - name: Build stripped engine (Windows x86_64, MinGW) into the template
        working-directory: godot-src
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 > /dev/null
          # Godot needs MinGW's posix thread model.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons
          "$RUNNER_TEMP/scons/bin/scons" platform=windows use_mingw=yes arch=x86_64 target=template_release profile="$ENGINE_PROFILE" \
            module_upnp_enabled=yes d3d12=no cache_path="$HOME/.scons_cache" -j"$(nproc)"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp bin/godot.windows.template_release.x86_64.exe "$tpl/windows_release_x86_64.exe"
          cp bin/godot.windows.template_release.x86_64.console.exe "$tpl/windows_release_x86_64_console.exe"
          echo "::notice::server engine $(du -h "$tpl/windows_release_x86_64.exe" | cut -f1)"

      # The compat id's client-only list (tools/client_only_paths.txt) still
      # matches the project, and the id ignores only what it lists.
      - name: Compat id test
        run: python3 server/compat_id_test.py

      # Same data as the iOS build, so the bundled mods (and their digest) match.
      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      # The commit this build comes from and its compat id: the server refuses
      # players of a build with another compat id (a newer build that changed
      # only client-only files still joins). And the release's version, which
      # phones show for this server in JOIN A GAME and MY SERVERS (without it:
      # DEV BUILD); pull requests have none.
      - name: Stamp build id and version
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          echo "$GITHUB_SHA" > project/build_id.txt
          python3 tools/compat_id.py project > project/compat_id.txt
          if [ -n "$VERSION" ]; then echo "$VERSION" > project/build_version.txt; fi
          echo "::notice::compat id $(cat project/compat_id.txt), version ${VERSION:-none}"

      # The lobby list's address and password (project/lobby_server.txt), as in
      # the phone builds: a server with listed=true shows in their JOIN GAME list.
      - name: Lobby list address
        env:
          LOBBY_SERVER: ${{ secrets.LOBBY_SERVER }}
        run: |
          if [ -n "$LOBBY_SERVER" ]; then printf '%s\n' "$LOBBY_SERVER" > project/lobby_server.txt
          else echo "::warning::No LOBBY_SERVER secret: this server cannot be listed online"; fi

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-server-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-server-${{ env.GODOT_VERSION }}-

      - name: Import + export Windows server
        working-directory: project
        run: |
          mkdir -p ../build/server
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "Windows Server" ../build/server/PokeWilds.exe
          ls -la ../build/server

      # The stamps went into the pack: each file's text is stored there as is.
      - name: Check the pack's stamps
        run: |
          stamps="build_id compat_id"
          [ "$GITHUB_EVENT_NAME" = pull_request ] || stamps="$stamps build_version"
          for stamp in $stamps; do
            test -s "project/$stamp.txt" && grep -aqF "$(cat "project/$stamp.txt")" build/server/PokeWilds.pck \
              || { echo "::error::$stamp.txt is missing from PokeWilds.pck"; exit 1; }
          done

      # Only a server that a client could join and that saved goes into the release.
      - name: Server smoke test
        run: timeout 1800 python3 -u server/smoke_test.py "$GODOT"

      - name: Package zip
        run: |
          cd build/server
          cp ../../README_SERVER.md ../../server/start_server.bat ../../server/server_launcher.ps1 ../../server/server.cfg.example .
          zip -9 ../../PokeWilds-Server-win64.zip PokeWilds.exe PokeWilds.console.exe PokeWilds.pck \
            README_SERVER.md start_server.bat server_launcher.ps1 server.cfg.example
          ls -la ../../PokeWilds-Server-win64.zip

      # The game itself on Windows: the same engine and the same stamps, one
      # exe with the pack inside, no console. Nothing in it starts a server:
      # that only happens with --server (dedicated_server.gd).
      - name: Export + package the Windows game
        working-directory: project
        run: |
          mkdir -p ../build/win
          "$GODOT" --headless --export-release "Windows Desktop" ../build/win/PokeWilds.exe
          for stamp in build_id compat_id; do
            grep -aqF "$(cat "$stamp.txt")" ../build/win/PokeWilds.exe || { echo "::error::$stamp.txt is missing from PokeWilds.exe"; exit 1; }
          done
          cd ../build/win
          zip -9 ../../PokeWilds-win64.zip PokeWilds.exe
          ls -la ../../PokeWilds-win64.zip

      - name: Add the server and the game to the draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" PokeWilds-Server-win64.zip PokeWilds-win64.zip

  # The game and the server on Linux (x86_64): the stripped engine with the
  # game's module and UPnP, built with X11/ALSA/PulseAudio for a window and
  # sound, in place of the official template. ubuntu-22.04 on purpose: the
  # binary needs a glibc no newer than the runner's (2.35), so it runs on most
  # distributions from 2022 on. Same stamps as the Windows server.
  linux:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Install Godot + Linux libraries + SCons
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxext-dev libxrender-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libgl1-mesa-dev > /dev/null
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          key: scons-linux-desktop-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: scons-linux-desktop-${{ env.GODOT_VERSION }}-

      # Only the Linux template is needed; the editor looks for it by name.
      - name: Build stripped engine (Linux x86_64, desktop) into the template
        working-directory: godot-src
        run: |
          "$RUNNER_TEMP/scons/bin/scons" platform=linuxbsd arch=x86_64 target=template_release profile="$ENGINE_PROFILE" \
            module_upnp_enabled=yes x11=yes wayland=no alsa=yes pulseaudio=yes udev=yes dbus=no speechd=no fontconfig=no \
            cache_path="$HOME/.scons_cache" -j"$(nproc)"
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          cp bin/godot.linuxbsd.template_release.x86_64 "$tpl/linux_release.x86_64"
          echo "$GODOT_VERSION.stable" > "$tpl/version.txt"
          echo "::notice::linux engine $(du -h "$tpl/linux_release.x86_64" | cut -f1)"

      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      - uses: ./.github/actions/stamp
        with:
          version: ${{ needs.draft.outputs.version }}
          lobby: ${{ secrets.LOBBY_SERVER }}

      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-linux-${{ env.GODOT_VERSION }}-

      - name: Import + export the Linux server and game
        working-directory: project
        run: |
          mkdir -p ../build/linux ../build/linux-server
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "Linux Server" ../build/linux-server/PokeWilds.x86_64
          "$GODOT" --headless --export-release "Linux" ../build/linux/PokeWilds.x86_64
          ls -la ../build/linux ../build/linux-server

      - name: Check the packs' stamps
        run: |
          for stamp in build_id compat_id; do
            for file in build/linux-server/PokeWilds.pck build/linux/PokeWilds.x86_64; do
              grep -aqF "$(cat "project/$stamp.txt")" "$file" || { echo "::error::$stamp.txt is missing from $file"; exit 1; }
            done
          done

      # The exported server itself (not the editor): a client joins, a new area
      # is made, the world is saved. Only then does it go into the release.
      - name: Server smoke test
        run: timeout 1800 python3 -u server/smoke_test.py "$PWD/build/linux-server/PokeWilds.x86_64" --exe

      - name: Package
        run: |
          cd build/linux-server
          cp ../../README_SERVER.md ../../server/start_server.sh ../../server/server.cfg.example .
          chmod +x PokeWilds.x86_64 start_server.sh
          tar -czf ../../PokeWilds-Server-linux-x86_64.tar.gz PokeWilds.x86_64 PokeWilds.pck README_SERVER.md start_server.sh server.cfg.example
          cd ../linux
          chmod +x PokeWilds.x86_64
          tar -czf ../../PokeWilds-linux-x86_64.tar.gz PokeWilds.x86_64
          ls -la ../../PokeWilds-*linux*

      - name: Add the server and the game to the draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" PokeWilds-Server-linux-x86_64.tar.gz PokeWilds-linux-x86_64.tar.gz

  # The game and the server on macOS (universal: Apple silicon and Intel): the
  # same stripped engine with the game's module and UPnP, built on a Mac for
  # both architectures and put into the official macOS template in place of its
  # binary. Not signed by Apple (no developer account): ad-hoc signed only, so
  # the first launch needs right-click > Open.
  macos:
    needs: draft
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: macos-26
    env:
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - name: Install Godot + the official macOS template
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/macos.zip' 'templates/version.txt' -d "$tpl"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          echo "TPL=$tpl" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          key: scons-macos-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: scons-macos-${{ env.GODOT_VERSION }}-

      - name: Build stripped engine (macOS universal) into the template
        working-directory: godot-src
        run: |
          "$RUNNER_TEMP/scons/bin/scons" platform=macos arch=universal target=template_release profile="$ENGINE_PROFILE" \
            module_upnp_enabled=yes cache_path="$HOME/.scons_cache" -j"$(sysctl -n hw.ncpu)"
          # The official template is a zip of macos_template.app: its binary
          # (the export copies the release one) is replaced by ours.
          rm -rf "$RUNNER_TEMP/tpl" && mkdir "$RUNNER_TEMP/tpl"
          unzip -q "$TPL/macos.zip" -d "$RUNNER_TEMP/tpl"
          cp bin/godot.macos.template_release.universal "$RUNNER_TEMP/tpl/macos_template.app/Contents/MacOS/godot_macos_release.universal"
          chmod +x "$RUNNER_TEMP/tpl/macos_template.app/Contents/MacOS/"*
          rm "$TPL/macos.zip"
          (cd "$RUNNER_TEMP/tpl" && zip -qry "$TPL/macos.zip" .)
          lipo -info bin/godot.macos.template_release.universal
          echo "::notice::macos engine $(du -h bin/godot.macos.template_release.universal | cut -f1)"

      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      - uses: ./.github/actions/stamp
        with:
          version: ${{ needs.draft.outputs.version }}
          lobby: ${{ secrets.LOBBY_SERVER }}

      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-macos-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-macos-${{ env.GODOT_VERSION }}-

      # Each export is a zip with PokeWilds.app (the pack inside). Signed ad hoc
      # (the Mac refuses to run an arm64 binary with no signature at all) and
      # zipped again with ditto, which keeps permissions and the bundle intact.
      - name: Import + export the macOS server and game
        working-directory: project
        run: |
          "$GODOT" --headless --import
          for preset in "macOS:macos" "macOS Server:macos-server"; do
            name=${preset%%:*}; dir=../build/${preset##*:}
            mkdir -p "$dir"
            "$GODOT" --headless --export-release "$name" "$dir/PokeWilds.zip"
            (cd "$dir" && unzip -q PokeWilds.zip && rm PokeWilds.zip \
              && test -x PokeWilds.app/Contents/MacOS/PokeWilds \
              && for stamp in build_id compat_id; do grep -aqF "$(cat "../../project/$stamp.txt")" PokeWilds.app/Contents/Resources/PokeWilds.pck || { echo "::error::$stamp.txt is missing from the pack"; exit 1; }; done \
              && codesign --force --deep -s - PokeWilds.app)
          done
          ls -la ../build/macos ../build/macos-server

      # The exported server itself, as on Linux.
      - name: Server smoke test
        run: timeout 1800 python3 -u server/smoke_test.py "$PWD/build/macos-server/PokeWilds.app/Contents/MacOS/PokeWilds" --exe

      - name: Package
        run: |
          (cd build/macos && ditto -c -k --keepParent PokeWilds.app ../../PokeWilds-macos.zip)
          cd build/macos-server
          cp ../../README_SERVER.md ../../server/start_server.sh ../../server/server.cfg.example .
          chmod +x start_server.sh
          zip -qry ../../PokeWilds-Server-macos.zip PokeWilds.app README_SERVER.md start_server.sh server.cfg.example
          ls -la ../../PokeWilds-*macos*

      - name: Add the server and the game to the draft release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" PokeWilds-Server-macos.zip PokeWilds-macos.zip

  # The Android APK (arm64): stock editor and official templates with the game's
  # own Gradle wrapper (project/android/build), the IPA's stripped engine and
  # libzt for ONLINE play, signed
  # with the release keystore (secrets ANDROID_KEYSTORE_BASE64 and
  # ANDROID_KEYSTORE_PASSWORD, alias "pokewilds"): every APK has the same
  # signature, so each one installs over the last.
  android:
    needs: draft
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ needs.draft.outputs.tag }}
      NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.22.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The versions project/android/build/config.gradle asks for.
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.1.0" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # libzt's AAR (build_libzt_android.sh), compiled once per patch set.
      - uses: actions/cache@v4
        id: libzt
        with:
          path: project/android/build/libs/zerotier
          key: libzt-android-${{ hashFiles('build_libzt_android.sh', 'libzt_patches.py', 'tools/build_libzt_ios.sh') }}

      - name: Build libzt for Android
        if: steps.libzt.outputs.cache-hit != 'true'
        run: |
          # The commit the iOS plugin uses.
          commit=$(sed -n 's/^LIBZT_COMMIT=//p' tools/build_libzt_ios.sh)
          git clone -q https://github.com/zerotier/libzt "$RUNNER_TEMP/libzt"
          git -C "$RUNNER_TEMP/libzt" -c advice.detachedHead=false checkout -q "$commit"
          git -C "$RUNNER_TEMP/libzt" submodule -q update --init
          LIBZT_SRC="$RUNNER_TEMP/libzt" LIBZT_WORK="$RUNNER_TEMP/libzt-work" bash build_libzt_android.sh

      - name: Install Godot + Android export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q -j templates.tpz 'templates/android_source.zip' 'templates/version.txt' -d "$tpl"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          # The game keeps its own wrapper (src/, res/, Gradle files): only the
          # engine libraries come from the template, as BUILD.txt describes.
          unzip -q "$tpl/android_source.zip" 'libs/*' -d "$RUNNER_TEMP/android_source"
          cp -R "$RUNNER_TEMP/android_source/libs/." project/android/build/libs/
          # Where this Godot looks for the installed template's version.
          for f in project/android/.build_version project/android/build/.build_version; do printf '%s' "${GODOT_VERSION}.stable" > "$f"; done
          echo "AAR=$PWD/project/android/build/libs/release/godot-lib.template_release.aar" >> "$GITHUB_ENV"
          # Where the editor finds the SDK and Java (no editor UI here).
          mkdir -p ~/.config/godot
          for name in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/$name
          done

      # The same stripped engine as the IPA (.github/engine/custom.py), arm64,
      # in place of the official one inside the template's godot-lib AAR.
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot-src

      - uses: actions/cache@v4
        with:
          path: ~/.scons_cache
          # One cache per build profile and game module (see the smoke job).
          key: scons-android-${{ env.GODOT_VERSION }}-${{ hashFiles('.github/engine/custom.py', 'engine_modules/**') }}
          restore-keys: scons-android-${{ env.GODOT_VERSION }}-

      - name: Build stripped engine (Android arm64)
        working-directory: godot-src
        run: |
          python3 -m venv "$RUNNER_TEMP/scons" && "$RUNNER_TEMP/scons/bin/pip" -q install scons
          # Frame pacing (Swappy), as in the official template.
          python3 misc/scripts/install_swappy_android.py
          "$RUNNER_TEMP/scons/bin/scons" platform=android arch=arm64 target=template_release profile="$ENGINE_PROFILE" \
            cache_path="$HOME/.scons_cache" -j"$(nproc)"

      - name: Swap engine library into the AAR
        run: |
          so=godot-src/platform/android/java/lib/libs/release/arm64-v8a/libgodot_android.so
          entry=jni/arm64-v8a/libgodot_android.so
          unzip -l "$AAR" | grep -q " $entry$" || { unzip -l "$AAR"; exit 1; }
          echo "::notice::official engine lib $(unzip -l "$AAR" "$entry" | awk 'NR==4{printf "%.1f MB", $1/1e6}')"
          mkdir -p "$RUNNER_TEMP/aar/jni/arm64-v8a"
          "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded \
            -o "$RUNNER_TEMP/aar/$entry" "$so"
          (cd "$RUNNER_TEMP/aar" && zip -q "$AAR" "$entry")
          echo "::notice::stripped engine lib $(du -h "$RUNNER_TEMP/aar/$entry" | cut -f1)"

      # Same data as the other builds, so the bundled mods (and their digest) match.
      - name: Minify JSON data
        run: python3 .github/engine/minify_json.py project

      # Same build id, compat id and version as the IPA: the APK plays with this
      # release's IPA and server. Its versionCode is the commit count, so it only goes up.
      - name: Stamp build id and APK version
        env:
          VERSION: ${{ needs.draft.outputs.version }}
          BUNDLE: ${{ needs.draft.outputs.bundle }}
        run: |
          echo "$GITHUB_SHA" > project/build_id.txt
          python3 tools/compat_id.py project > project/compat_id.txt
          echo "$VERSION" > project/build_version.txt
          python3 - <<'EOF'
          import os, re
          path = "project/export_presets.cfg"
          text = open(path, newline="").read()
          text = re.sub(r'(?m)^version/name="[^"]*"', 'version/name="%s"' % os.environ["VERSION"], text)
          text = re.sub(r'(?m)^version/code=\d+', 'version/code=%s' % os.environ["BUNDLE"], text)
          open(path, "w", newline="").write(text)
          EOF
          grep -n '^version/' project/export_presets.cfg

      - name: Lobby list address
        env:
          LOBBY_SERVER: ${{ secrets.LOBBY_SERVER }}
        run: |
          if [ -n "$LOBBY_SERVER" ]; then printf '%s\n' "$LOBBY_SERVER" > project/lobby_server.txt
          else echo "::warning::No LOBBY_SERVER secret: this APK has no online lobby list"; fi

      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are needed to sign the APK"; exit 1; fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=pokewilds" >> "$GITHUB_ENV"

      # Godot's import cache (.godot): only assets that changed since are imported again.
      - uses: actions/cache@v4
        with:
          path: project/.godot
          key: godot-import-android-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-android-${{ env.GODOT_VERSION }}-

      - name: Import + export the APK
        working-directory: project
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p ../build/android
          "$GODOT" --headless --import
          "$GODOT" --headless --export-release "Android" ../build/android/Pokewilds-arm64.apk 2>&1 | tee export.log \
            || { grep -E -i -B2 -A8 'error|FAILURE|What went wrong' export.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed 's/^/::error::/'; echo; exit 1; }
          test -f ../build/android/Pokewilds-arm64.apk
          echo "::notice::APK $(du -h ../build/android/Pokewilds-arm64.apk | cut -f1)"

      - name: Add the APK to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload --clobber "$TAG" build/android/Pokewilds-arm64.apk

  # World generation must stay byte-identical per seed and size: saves, world
  # caches and co-op peers all regenerate from it. 35 worlds (all five sizes) are
  # hashed and compared with worldgen_check.gd and worldgen_hashes.json, four
  # processes at once. Not tied to the draft: pull requests run it too.
  worldgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot editor
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      # The import cache the server job saves (same editor, same assets); this job only reads it.
      - uses: actions/cache/restore@v4
        with:
          path: project/.godot
          key: godot-import-server-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-server-${{ env.GODOT_VERSION }}-

      - name: Import
        working-directory: project
        run: |
          "$GODOT" --headless --import

      # A hash that differs, or a shard that died without its "checked" line, fails the job.
      - name: Check the world hashes
        working-directory: project
        run: |
          for k in 0 1 2 3; do
            "$GODOT" --headless -s ../.github/engine/worldgen_check.gd -- --shard $k/4 > "$RUNNER_TEMP/worldgen$k.log" 2>&1 &
            pids="$pids $!"
          done
          failed=0
          for pid in $pids; do wait "$pid" || failed=1; done
          cat "$RUNNER_TEMP"/worldgen?.log
          grep -h "WORLDGEN FAIL" "$RUNNER_TEMP"/worldgen?.log | sed 's/^/::error::/' || true
          grep -h "^WORLDGEN:" "$RUNNER_TEMP"/worldgen?.log | sed 's/^/::notice::/'
          [ "$(cat "$RUNNER_TEMP"/worldgen?.log | grep -c '^WORLDGEN: checked')" = 4 ] || failed=1
          exit $failed

  # The quick headless tests of server/ (server/fast_tests.py: four at a time, a
  # failure annotated, a flaky one run once more), the lobby directory's tests,
  # and the saves of old games (server/fixtures) loaded by the current code.
  # Pull requests run it too. The tests run with the Dummy 2D physics server, the
  # one the phones have (the stock editor has another).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot editor
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@v4
        with:
          path: project/.godot
          key: godot-import-server-${{ env.GODOT_VERSION }}-${{ hashFiles('project/assets/**/*.import') }}
          restore-keys: godot-import-server-${{ env.GODOT_VERSION }}-

      - name: Import
        working-directory: project
        run: |
          "$GODOT" --headless --import
          printf '[physics]\n2d/physics_engine="Dummy"\n' > override.cfg

      - name: Lobby directory tests
        run: node lobby-directory/test/directory.test.mjs

      - name: Headless tests
        run: python3 -u server/fast_tests.py "$GODOT" --jobs 4

      # No proxy tile made in a per-frame function (tools/lint_tile_at.py).
      - name: Per-frame tile_at lint
        run: python3 tools/lint_tile_at.py

      # The world played the same way gives the same saved state and tiles
      # (server/world_sim_hash.gd): a refactor that changes behaviour shows here.
      - name: World simulation hash
        run: |
          "$GODOT" --headless --fixed-fps 60 --path project -s "$PWD/server/world_sim_hash.gd" -- \
            --expect=4e1cc7e47c23a84d7b84c1c02ef5ed64d13658ef1b9dd234d96af55050d08203 2>&1 | tee sim.log
          grep -q "4e1cc7e47c23a84d7b84c1c02ef5ed64d13658ef1b9dd234d96af55050d08203" sim.log

      # The world's Pokemon played the same way give the same population
      # (server/population_sim_hash.gd), drawn and as the dedicated server runs it.
      - name: Population simulation hash
        run: |
          "$GODOT" --headless --fixed-fps 60 --path project -s "$PWD/server/population_sim_hash.gd" -- \
            --expect=d60bd575a137bc966c7eb37c8c5fbd67e7dba8c36692c4e71ab634739865e312 2>&1 | tee pop.log
          grep -q "d60bd575a137bc966c7eb37c8c5fbd67e7dba8c36692c4e71ab634739865e312" pop.log
          "$GODOT" --headless --fixed-fps 60 --path project -s "$PWD/server/population_sim_hash.gd" -- \
            --no-sprites --expect=d60bd575a137bc966c7eb37c8c5fbd67e7dba8c36692c4e71ab634739865e312 2>&1 | tee pop_server.log
          grep -q "d60bd575a137bc966c7eb37c8c5fbd67e7dba8c36692c4e71ab634739865e312" pop_server.log

  publish:
    needs: [draft, smoke, ios_xtool, server, linux, macos, android, worldgen, tests]
    # The IPA from the Mac or, failing that, from xtool: ios_xtool says which.
    if: ${{ always() && needs.draft.result == 'success' && needs.smoke.result == 'success' && needs.server.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.android.result == 'success' && needs.worldgen.result == 'success' && needs.tests.result == 'success' && needs.ios_xtool.outputs.ipa == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - name: Publish the release as Latest
        run: |
          gh release edit "$TAG" --draft=false --latest
          # Keep the ten newest builds.
          gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +11 \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done

  # The sideloading source (Feather, AltStore, SideStore...): apps.json with
  # every published IPA, made again from the releases after each one and kept
  # on the "source" branch (the README gives its address). A job of its own, so
  # a failure here never touches the release.
  source:
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Update apps.json on the source branch
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" | python3 .github/source/make_source.py > apps.json
          sha=$(gh api "repos/$GH_REPO/contents/apps.json?ref=source" --jq .sha)
          gh api -X PUT "repos/$GH_REPO/contents/apps.json" --silent -f branch=source -f sha="$sha"             -f message="Source: build of ${GITHUB_SHA::8}" -f content="$(base64 -w0 apps.json)"

  # A build that was not published (a job failed, was cancelled or never got a
  # runner) leaves no half release behind. To retry it, use "Re-run all jobs":
  # the draft is made again.
  discard:
    needs: [draft, publish]
    if: ${{ always() && needs.draft.result == 'success' && needs.publish.result != 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - name: Delete the draft release
        run: gh release delete "$TAG" --yes
